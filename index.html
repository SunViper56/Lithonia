// ---------------------------------------------------------------------
// Supabase Storage
// ---------------------------------------------------------------------

function rowToEntry(row){
  return {
    id: row.id,
    title: row.title,
    category: row.category,
    tags: Array.isArray(row.tags) ? row.tags : [],
    summary: row.summary || '',
    content: row.content || '',
    image: row.image || '',
    relatedIds: Array.isArray(row.related_ids) ? row.related_ids : [],
    createdAt: Number(row.created_at),
    updatedAt: Number(row.updated_at)
  };
}

async function loadData(){
  try {
    const { data, error } = await supabase
      .from('entries')
      .select('*')
      .order('title', { ascending: true });

    if(error) throw error;

    entries = (data || []).map(rowToEntry);

    const { data: settings, error: settingsError } = await supabase
      .from('wiki_settings')
      .select('*')
      .eq('id', 'main')
      .maybeSingle();

    if(settingsError) throw settingsError;

    aboutText = settings ? settings.about_text : '';

    dataLoaded = true;

  } catch(e) {
    console.error('Failed to load Lithonia data:', e);
    alert('Could not connect to the Lithonia archives. Please check your Supabase connection.');
    entries = [];
    aboutText = '';
    dataLoaded = true;
  }
}

async function saveEntryToDatabase(entry){
  const row = {
    id: entry.id,
    title: entry.title,
    category: entry.category,
    tags: entry.tags || [],
    summary: entry.summary || '',
    content: entry.content || '',
    image: entry.image || '',
    related_ids: entry.relatedIds || [],
    created_at: entry.createdAt,
    updated_at: entry.updatedAt
  };

  const { error } = await supabase
    .from('entries')
    .upsert(row);

  if(error){
    console.error('Failed to save entry:', error);
    alert('Could not save this entry. Make sure you are signed in as the DM.');
    throw error;
  }
}

async function deleteEntryFromDatabase(id){
  const { error } = await supabase
    .from('entries')
    .delete()
    .eq('id', id);

  if(error){
    console.error('Failed to delete entry:', error);
    alert('Could not delete this entry.');
    throw error;
  }
}

async function saveEntries(){
  try {
    for(const entry of entries){
      await saveEntryToDatabase(entry);
    }
  } catch(e) {
    console.error('Failed to save entries:', e);
  }
}

async function saveAbout(){
  try {
    const { error } = await supabase
      .from('wiki_settings')
      .upsert({
        id: 'main',
        about_text: aboutText
      });

    if(error) throw error;

  } catch(e) {
    console.error('Failed to save about text:', e);
    alert('Could not save the introduction. Make sure you are signed in as the DM.');
  }
}

// ---------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------
function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function genId(){ return 'e_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function findEntryByTitle(title){
  const t = title.trim().toLowerCase();
  return entries.find(e => e.title.trim().toLowerCase() === t);
}

function renderContent(raw){
  let text = escapeHtml(raw || '');
  // bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // wiki links  [[Title]] or [[Title|Display]]
  text = text.replace(/\[\[(.+?)\]\]/g, (m, inner) => {
    const parts = inner.split('|');
    const target = parts[0].trim();
    const display = (parts[1] || parts[0]).trim();
    const found = findEntryByTitle(target);
    if(found){
      return `<a class="wiki-link" href="javascript:void(0)" onclick="navigateToEntry('${found.id}')">${escapeHtml(display)}</a>`;
    }
    return `<span class="wiki-link unwritten" title="No entry written yet">${escapeHtml(display)}</span>`;
  });
  // paragraphs
  const paras = text.split(/\n\s*\n/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
  return paras;
}

function fmtDate(ts){
  return new Date(ts).toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });
}

// Export / Import backup
// ---------------------------------------------------------------------
function exportBackup(){
  const payload = { exportedAt: new Date().toISOString(), about: aboutText, entries: entries };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'lithonia-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){
  document.getElementById('import-file-input').click();
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try{
      const data = JSON.parse(evt.target.result);
      if(!data.entries || !Array.isArray(data.entries)) throw new Error('bad format');
      const ok = confirm('This will replace the entire wiki (' + entries.length + ' entries) with ' + data.entries.length + ' entries from the backup file. Continue?');
      if(!ok) return;
      entries = data.entries;
      aboutText = data.about || aboutText;
      await saveEntries();
      await saveAbout();
      navigateHome();
    } catch(err){
      alert('That file could not be read as a Lithonia backup.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

      </div>

        <label for="f-related">Related entries <span class="hint">(ctrl/cmd-click to select several)</span></label>
        <select id="f-related" multiple size="6">
          ${relatedOptionsHtml(editing ? editing.id : null, editing ? editing.relatedIds || [] : [])}
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn">${editing ? 'Save changes' : 'Add entry'}</button>
        <button type="button" class="btn secondary" onclick="${editing ? `navigateToEntry('${editing.id}')` : 'navigateHome()'}">Cancel</button>
        ${editing ? `<button type="button" class="btn danger" style="margin-left:auto;" onclick="handleDeleteEntry('${editing.id}')">Delete entry</button>` : ''}

async function handleEntrySave(e, editingId){
  e.preventDefault();
  const title = document.getElementById('f-title').value.trim();
  if(!title){ alert('Please give the entry a title.'); return false; }
  const category = document.getElementById('f-category').value;
  const tags = document.getElementById('f-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const summary = document.getElementById('f-summary').value.trim();
  const image = document.getElementById('f-image').value.trim();
  const content = document.getElementById('f-content').value;
  const related = Array.from(document.getElementById('f-related').selectedOptions).map(o=>o.value);

  if(editingId){
    const entry = entries.find(e2 => e2.id === editingId);
    Object.assign(entry, { title, category, tags, summary, image, content, relatedIds: related, updatedAt: Date.now() });
    await saveEntries();
    navigateToEntry(editingId);
  } else {
    const newEntry = {
      id: genId(), title, category, tags, summary, image, content,
      relatedIds: related, createdAt: Date.now(), updatedAt: Date.now()
    };
    entries.push(newEntry);
    await saveEntries();
    navigateToEntry(newEntry.id);
  }
  return false;
}

async function handleDeleteEntry(id){
  const entry = entries.find(e=>e.id === id);
  if(!entry) return;
  const ok = confirm(`Delete "${entry.title}" permanently? This can't be undone.`);
  if(!ok) return;
  entries = entries.filter(e=>e.id !== id);
  entries.forEach(e => { if(e.relatedIds) e.relatedIds = e.relatedIds.filter(r => r !== id); });
  await saveEntries();
  navigateHome();
}

// Search

function matchEntries(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  return entries.filter(e => {
    if(e.title.toLowerCase().includes(q)) return true;
    if(e.summary && e.summary.toLowerCase().includes(q)) return true;
    if(e.tags && e.tags.some(t => t.toLowerCase().includes(q))) return true;
    return false;
  }).sort((a,b)=>a.title.localeCompare(b.title));
}

function handleSearchInput(e){
  const q = e.target.value;
  const drop = document.getElementById('search-drop');
  if(!drop) return;
  if(!q.trim()){ drop.style.display = 'none'; drop.innerHTML=''; return; }
  const results = matchEntries(q).slice(0,8);
  if(results.length === 0){
    drop.innerHTML = `<div class="search-empty">No lore found for "${escapeHtml(q)}"</div>`;
  } else {
    drop.innerHTML = results.map(r => {
      const cat = getCategory(r.category);
      return `<div class="sr-item" onclick="closeSearchDrop(); navigateToEntry('${r.id}')">
        <span class="chapter-dot" style="background:${cat.hex}"></span>
        <span class="sr-title">${escapeHtml(r.title)}</span>
        <span class="sr-cat">${cat.label}</span>
      </div>`;
    }).join('');
  }
  drop.style.display = 'block';
}
function handleSearchKeydown(e){
  if(e.key === 'Enter'){
    const q = e.target.value;
    if(q.trim()){ closeSearchDrop(); navigateToSearch(q); e.target.blur(); }
  } else if(e.key === 'Escape'){
    closeSearchDrop();
    e.target.blur();
  }
}
function closeSearchDrop(){
  const drop = document.getElementById('search-drop');
  if(drop){ drop.style.display = 'none'; }
}
document.addEventListener('click', (e)=>{
  const wrap = document.getElementById('search-wrap-el');
  if(wrap && !wrap.contains(e.target)) closeSearchDrop();
});

    </div>
    <p class="cat-desc">${cat.desc}</p>
    ${isDM ? `<div class="cat-toolbar"><button class="btn tiny" onclick="navigate({type:'edit', id:null, presetCategory:'${key}'})">+ Add entry to ${cat.label}</button></div>` : ''}
    <div class="entry-list">
      ${rows || `<div class="empty-note">No entries yet in this chapter.${isDM ? ' Use the button above to add the first one.' : ''}</div>`}
    </div>
  `;
}

function renderEntry(id){
  const entry = entries.find(e=>e.id === id);
  if(!entry){
    return `<div class="empty-note">That entry no longer exists. <a href="javascript:void(0)" onclick="navigateHome()">Return home</a>.</div>`;
  }
  const cat = getCategory(entry.category);
  const related = (entry.relatedIds || []).map(rid => entries.find(e=>e.id===rid)).filter(Boolean);

  return `
    <div class="breadcrumb">
      <a href="javascript:void(0)" onclick="navigateHome()">Home</a>
      <span class="sep">›</span>
      <a href="javascript:void(0)" onclick="navigateToCategory('${cat.key}')">${cat.label}</a>
      <span class="sep">›</span>
      ${escapeHtml(entry.title)}
    </div>
    <div class="cat-badge" style="background:${cat.hex}"><svg><use href="#${cat.icon}"/></svg>${cat.label}</div>
    <div class="entry-header">
      <h2>${escapeHtml(entry.title)}</h2>
      ${isDM ? `
        <div class="entry-actions">
          <button class="btn secondary tiny" onclick="navigateToEdit('${entry.id}')">Edit</button>
          <button class="btn danger tiny" onclick="handleDeleteEntry('${entry.id}')">Delete</button>
        </div>
      ` : ''}
    </div>
    ${entry.tags && entry.tags.length ? `
      <div class="entry-tags">
        ${entry.tags.map(t => `<span class="tag-pill" onclick="navigateToSearch('${escapeHtml(t)}')">${escapeHtml(t)}</span>`).join('')}
      </div>
    ` : ''}
    ${entry.image ? `<img class="entry-image" src="${escapeHtml(entry.image)}" alt="${escapeHtml(entry.title)}" onerror="this.style.display='none'">` : ''}
    <div class="entry-content">${renderContent(entry.content)}</div>
    ${related.length ? `
      <div class="related-box">
        <h4>Related entries</h4>
        ${related.map(r => `<span class="related-pill" onclick="navigateToEntry('${r.id}')">${escapeHtml(r.title)}</span>`).join('')}
      </div>
    ` : ''}
    <div class="entry-meta">Last updated ${fmtDate(entry.updatedAt)}</div>
  `;
}

function renderSearch(query){
  const results = matchEntries(query);
  const rows = results.map(e => {
    const cat = getCategory(e.category);
    return `
      <div class="entry-row" onclick="navigateToEntry('${e.id}')">
        <div class="entry-tab" style="background:${cat.hex}"></div>
        <div class="entry-row-body">
          <div class="entry-row-title">${escapeHtml(e.title)}</div>
          <div class="entry-row-summary">${cat.label}${e.summary ? ' — ' + escapeHtml(e.summary) : ''}</div>
        </div>
      </div>
    `;
  }).join('');
  return `
    <div class="breadcrumb"><a href="javascript:void(0)" onclick="navigateHome()">Home</a><span class="sep">›</span>Search</div>
    <h2 style="margin-bottom:20px;">Results for "${escapeHtml(query)}"</h2>
    <div class="entry-list">${rows || `<div class="empty-note">No lore found. Try another word, or check with your DM.</div>`}</div>
  `;
}

// ---------------------------------------------------------------------
// Main render dispatch
// ---------------------------------------------------------------------
function renderPageBody(){
  switch(view.type){
    case 'home': return renderHome();
    case 'category': return renderCategory(view.key);
    case 'entry': return renderEntry(view.id);
    case 'search': return renderSearch(view.query);
    case 'edit': return renderEditForm();
    default: return renderHome();
  }
}

function render(){
  const root = document.getElementById('app-root');
  root.innerHTML = `
    ${renderHeader()}
    <div class="layout">
      ${renderSidebar()}
      <main class="page-area">
        <div class="page-frame">
          ${renderCorners()}
          ${renderPageBody()}
        </div>
      </main>
    </div>
    <footer class="site-footer">Lithonia — a living record, added to after every session.</footer>
  `;
}
async function signOut(){
  await supabase.auth.signOut();
  isDM = false;
  render();
}

// ---------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------
(async function init(){
  const { data: { session } } = await supabase.auth.getSession();
  isDM = !!session;

  supabase.auth.onAuthStateChange((_event, session) => {
    isDM = !!session;
    render();
  });

  await loadData();
  render();
})();
</script>
</body>
</html>
